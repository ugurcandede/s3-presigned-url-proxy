name: s3proxy

services:
  s3proxy:
    build: .
    container_name: s3proxy
    init: true
    ports:
      # Host port is configurable via .env (PROXY_HOST_PORT); container always listens on 8088.
      - "${PROXY_HOST_PORT:-8087}:8088"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - PRESIGNED_URL_EXPIRATION=${PRESIGNED_URL_EXPIRATION:-14400}
      - REQUIRED_PARAMS=${REQUIRED_PARAMS:-objectkey}
      - OBJECT_KEY_PARAM=${OBJECT_KEY_PARAM:-objectkey}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
