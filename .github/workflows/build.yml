name: Build and Deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v20*'        # CalVer: v2026.06.13.1430

env:
  IMAGE_NAME: s3-presigned-url-proxy

jobs:
  # Job 1: Build and Publish to Docker Hub
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    outputs:
      calver: ${{ steps.date.outputs.calver }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Get current date for CalVer
        id: date
        run: echo "calver=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.date.outputs.calver }}

      - name: Show tags to be published
        run: |
          echo "📦 Tags that will be published:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish summary
        run: |
          echo "## ✅ Build and Publish Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Docker Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`v${{ steps.date.outputs.calver }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Multi-platform build completed (amd64, arm64)" >> $GITHUB_STEP_SUMMARY

  # Job 2: Create GitHub Release (depends on build-and-deploy)
  release:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # CalVer is computed once in build-and-deploy and shared via job output
          VERSION="${{ needs.build-and-deploy.outputs.calver }}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📅 Using CalVer: $TAG"

      - name: Generate release notes
        id: release_notes
        run: |
          RELEASE_TYPE="📅 CalVer Auto-Release"

          cat > release_notes.md << 'EOF'
          ## 🚀 Release ${{ steps.version.outputs.tag }}
          
          **Release Type:** RELEASE_TYPE_PLACEHOLDER

          ### 📦 Docker Images

          **Docker Hub:**
          ```bash
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ```

          ### 🚀 Quick Start

          ```bash
          docker run -d \
            --name s3-presigned-url-proxy \
            -p 8087:8088 \
            -e AWS_REGION=us-east-1 \
            -e AWS_BUCKET=your-bucket \
            -e AWS_ACCESS_KEY_ID=your-key \
            -e AWS_SECRET_ACCESS_KEY=your-secret \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ```

          ### ✅ Features
          - Multi-platform support (amd64, arm64)
          - Health check endpoint
          - Read-only filesystem
          - Resource limits configured
          - Auto-restart enabled

          ### 📚 Documentation
          - [README.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md)
          - [ARCHITECTURE.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/ARCHITECTURE.md)
          EOF
          
          sed -i "s/RELEASE_TYPE_PLACEHOLDER/${RELEASE_TYPE}/g" release_notes.md

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.version.outputs.tag }}"
          
          # Create tag locally
          git tag -a "$TAG" -m "Release $TAG" || echo "Tag already exists locally"
          
          # Push to remote
          git push origin "$TAG" || echo "Tag already exists on remote"
          
          echo "✅ Tag $TAG ready for release"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## 🎉 Release ${{ steps.version.outputs.tag }} Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Hub: \`${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
